<?xml version="1.0" encoding="UTF-8"?>
<!--
  MARGIN / FORM — brand favicon (monogram mark)
  Original typographic lockup. Warm paper field, ink M/F serif letterforms,
  clay slash separator. Designed to remain legible at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Margin / Form">
  <title>Margin / Form</title>

  <!-- Warm paper background -->
  <rect width="64" height="64" fill="#F3EEE6"/>

  <!-- Subtle ink frame for definition at small sizes -->
  <rect x="3" y="3" width="58" height="58" fill="none" stroke="#252721" stroke-width="0.75" opacity="0.22"/>

  <!-- M letterform (ink, serif-style block) -->
  <g fill="#252721">
    <!-- Left vertical stem -->
    <rect x="8" y="17" width="4" height="30"/>
    <!-- Right vertical stem -->
    <rect x="24" y="17" width="4" height="30"/>
    <!-- Inner V (triangle connecting the stems, valley at center-bottom) -->
    <polygon points="12,17 20,44 24,17"/>
    <!-- Left stem serifs (top + bottom) -->
    <rect x="7" y="17" width="6" height="2"/>
    <rect x="7" y="45" width="6" height="2"/>
    <!-- Right stem serifs (top + bottom) -->
    <rect x="23" y="17" width="6" height="2"/>
    <rect x="23" y="45" width="6" height="2"/>
  </g>

  <!-- Clay slash separator between M and F -->
  <line x1="29" y1="48" x2="37" y2="14" stroke="#AD4E36" stroke-width="3.5" stroke-linecap="square"/>

  <!-- F letterform (ink, serif-style block) -->
  <g fill="#252721">
    <!-- Vertical stem -->
    <rect x="39" y="17" width="4" height="30"/>
    <!-- Top horizontal arm -->
    <rect x="39" y="17" width="16" height="4"/>
    <!-- Middle horizontal arm (shorter) -->
    <rect x="39" y="30" width="12" height="4"/>
    <!-- Bottom stem serif -->
    <rect x="38" y="45" width="6" height="2"/>
    <!-- Top-left corner serif -->
    <rect x="38" y="17" width="2" height="4"/>
    <!-- Top-right arm serif -->
    <rect x="53" y="17" width="2" height="4"/>
    <!-- Middle arm right serif -->
    <rect x="49" y="30" width="2" height="4"/>
  </g>
</svg>
